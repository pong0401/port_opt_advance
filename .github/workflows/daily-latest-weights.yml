name: Daily latest weights

on:
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "Also rebuild frozen backtest/precomputed files"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # 03:30 UTC is 10:30 Asia/Bangkok, late enough for Yahoo Finance's prior US close data to settle.
    - cron: "30 3 * * 2-6"

permissions:
  contents: write

concurrency:
  group: daily-latest-weights
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore yfinance timezone cache
        uses: actions/cache@v4
        with:
          path: data/cache/dynamic_factor_copula/.yfinance
          key: yfinance-tz-${{ runner.os }}
          restore-keys: yfinance-tz-${{ runner.os }}

      - name: Validate seeded market cache
        run: |
          test -f data/cache/portopt_optimizer_proof/20Y/prices.parquet
          test -f data/cache/portopt_optimizer_proof/20Y/volumes.parquet
          test -f data/cache/dynamic_factor_copula/extra_prices.parquet
          test -f data/cache/dynamic_factor_copula/extra_volumes.parquet
          test -f data/cache/dynamic_factor_copula/japan_master_history.parquet
          test -f data/cache/dynamic_factor_copula/japan_pit_universe_history.parquet
          test -f result/us_th_best_asset_sweep_dynamic_weight_history_thb.csv

      - name: Refresh latest overlay data
        run: python scripts/refresh_overlay_latest.py

      - name: Refresh Strategy B latest weights
        run: python scripts/refresh_us_th_best_config_latest.py

      - name: Refresh Strategy B final best Sharpe latest weights
        run: python scripts/refresh_us_th_tactical_final_best_latest.py

      - name: Refresh one-model US70 TH30 daily exposure latest weights
        run: python scripts/refresh_us_th_tactical_one_model_us70_th30_latest.py

      - name: Refresh US/TH/JP index-signal latest weights
        run: python scripts/refresh_us_th_jp_index_signal_latest.py

      - name: Rebuild frozen backtest dataset
        if: github.event_name == 'workflow_dispatch' && inputs.run_backtest == 'true'
        run: |
          python scripts/run_us_th_best_config.py
          python scripts/build_streamlit_precomputed.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/dynamic_factor_copula/overlay_compare_prices.parquet
          git add data/cache/dynamic_factor_copula/extra_prices.parquet
          git add data/cache/dynamic_factor_copula/extra_volumes.parquet
          git add result/us_th_best_asset_sweep_dynamic_weight_history_thb.csv
          git add result/us_th_best_asset_sweep_latest_asset_weights_thb.csv
          git add result/us_th_best_asset_sweep_latest_effective_weights_live_thb.csv
          git add result/us_th_side_trigger_daily_asset_exposure_realloc_stock_thb.csv
          git add -f result/us_th_side_trigger_cash_drag_latest_asset_weights_live_thb.csv
          git add result/us_th_side_trigger_latest_asset_weights_live_metadata.json
          git add result/us_th_side_trigger_latest_asset_weights_live_thb.csv
          git add -f result/us_th_stocks_only_latest_asset_weights_live_thb.csv
          git add -f result/us_th_tactical_perf_momentum_final_best_latest_effective_security_weights_thb.csv
          git add -f result/us_th_tactical_perf_momentum_final_best_latest_effective_sleeve_weights_thb.csv
          git add -f result/us_th_tactical_perf_momentum_final_best_latest_meta.csv
          git add -f result/us_th_tactical_perf_momentum_final_best_latest_meta.json
          git add -f result/us_th_tactical_one_model_us70_th30_latest_effective_weights_thb.csv
          git add -f result/us_th_tactical_one_model_us70_th30_latest_sleeve_weights_thb.csv
          git add -f result/us_th_tactical_one_model_us70_th30_latest_meta.csv
          git add -f result/us_th_tactical_one_model_us70_th30_latest_meta.json
          git add -f result/us_th_jp_optimized_minvol_top10_cap15_weekly_latest_effective_weights_thb.csv
          git add -f result/us_th_jp_optimized_minvol_top10_cap15_weekly_latest_sleeve_weights_thb.csv
          git add -f result/us_th_jp_optimized_minvol_top10_cap15_latest_meta.csv
          git add -f result/us_th_jp_optimized_minvol_top10_cap15_latest_meta.json
          git add data/precomputed
          git diff --cached --quiet || git commit -m "Refresh latest portfolio weights"
          git push
